# Static front for the docker/prod stack: client console at /, GM console at /gm/
# (built with `vite build --base=/gm/`), game API and push websocket proxied to the
# server container. The client opens its push connection on the same origin:
# ws(s)://<host>/ws?uid=…&sid=… (apps/client/src/game/game.ts, PUSH_ENDPOINT in
# packages/shared/src/protocol/push.ts), so only this one public port is needed.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Game sprites/sounds (public/assets, exported by pnpm legacy:assets) and hashed
    # Vite bundles are immutable for a given image.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /gm {
        return 301 /gm/;
    }

    location /gm/ {
        try_files $uri $uri/ /gm/index.html;
    }

    location /api/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
